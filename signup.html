<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bit-Wealth Sign Up Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 30px;
    }

    .box {
      max-width: 450px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1 {
      color: #123c72;
    }

    input,
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      box-sizing: border-box;
    }

    button {
      background: #123c72;
      color: white;
      border: 0;
      border-radius: 6px;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f0f4f8;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Bit-Wealth</h1>

  <p>Create a test account.</p>

  <form id="signupForm">

    <input
      type="email"
      id="email"
      placeholder="Email address"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password — minimum 8 characters"
      minlength="8"
      required
    >

    <button type="submit" id="button">
      Create Test Account
    </button>

  </form>

  <div id="result">JAVASCRIPT TEST</div>

<script>
  document.getElementById("result").textContent =
    "JavaScript is working!";
</script>

</div>

<script>

https://weovrftlcdcgpolmwlgl.supabase.co/rest/v1/

sb_publishable_Z7VJQvGcckiFNuWB1662qQ_CYiGJkwG

const result = document.getElementById("result");
const button = document.getElementById("button");

try {

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  result.textContent =
    "Supabase client loaded successfully.";

  document
    .getElementById("signupForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      button.disabled = true;
      button.textContent = "Testing...";

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      result.textContent =
        "Sending signup request to Supabase...";

      try {

        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password
          });

        if (error) {

          result.textContent =
            "SUPABASE ERROR:\n\n" +
            error.message;

          console.error(error);

          return;
        }

        result.textContent =
          "SUCCESS!\n\n" +
          "User ID: " +
          (data.user ? data.user.id : "No user returned") +
          "\n\n" +
          "Confirmation required: " +
          (!data.session);

      } catch (error) {

        result.textContent =
          "JAVASCRIPT ERROR:\n\n" +
          error.message;

        console.error(error);

      } finally {

        button.disabled = false;
        button.textContent = "Create Test Account";

      }

    });

} catch (error) {

  result.textContent =
    "CLIENT ERROR:\n\n" +
    error.message;

}

</script>

</body>
</html>
