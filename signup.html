<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Bit-Wealth</title>

  <meta name="description" content="Create your Bit-Wealth account.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #071f43, #1769aa);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 450px;
    }

    .logo {
      text-align: center;
      color: white;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    h1 {
      color: #123c72;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #657386;
      margin-bottom: 28px;
      font-size: 14px;
    }

    label {
      display: block;
      color: #26364d;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d7dee8;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #1769aa;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #123c72;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1769aa;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #657386;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
    }

    .links a {
      color: #1769aa;
      text-decoration: none;
      font-weight: bold;
    }

    .legal {
      text-align: center;
      margin-top: 18px;
      color: #718096;
      font-size: 12px;
    }

    .legal a {
      color: #1769aa;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">Bit-Wealth</div>

    <div class="card">

      <h1>Create Account</h1>

      <p class="subtitle">
        Create your Bit-Wealth account to get started.
      </p>

      <form id="signupForm">

        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Create a password"
          minlength="8"
          required
        >

        <label for="confirmPassword">Confirm Password</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm your password"
          minlength="8"
          required
        >

        <button type="submit" id="signupButton">
          Create Account
        </button>

      </form>

      <div id="message"></div>

      <div class="links">
        Already have an account?
        <a href="login.html">Log in</a>
      </div>

      <div class="legal">
        By creating an account, you agree to our
        <a href="terms.html">Terms &amp; Conditions</a>
        and
        <a href="privacy.html">Privacy Policy</a>.
      </div>

    </div>

  </div>

  <script>

    // ==========================================
    // BIT-WEALTH SUPABASE CONFIGURATION
    // ==========================================

    https://weovrftlcdcgpolmwlgl.supabase.co/rest/v1/

    sb_publishable_Z7VJQvGcckiFNuWB1662qQ_CYiGJkwG

    const { createClient } = supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    // ==========================================
    // SIGN UP
    // ==========================================

    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      message.textContent = "";

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      if (password.length < 8) {
        message.textContent =
          "Password must contain at least 8 characters.";
        return;
      }

      button.disabled = true;
      button.textContent = "Creating account...";

      try {

        const { data, error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password
          });

        if (error) {
          throw error;
        }

        message.textContent =
          "Account created successfully. Please check your email if confirmation is required.";

        form.reset();

      } catch (error) {

        message.textContent =
          error.message || "Unable to create your account.";

      } finally {

        button.disabled = false;
        button.textContent = "Create Account";

      }

    });

  </script>

</body>
  </html>
