<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Bit-Wealth</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071f43, #1769aa);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      color: #123c72;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      color: #172033;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #68778b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dce5;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #123c72;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      padding: 10px;
      color: #123c72;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    .login a {
      color: #1769aa;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="logo">Bit-Wealth</div>

  <h1>Create Account</h1>

  <p class="subtitle">
    Create your Bit-Wealth account.
  </p>

  <form id="signupForm">

    <label for="email">Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      placeholder="At least 8 characters"
      minlength="8"
      required
    >

    <button type="submit" id="signupButton">
      Create Account
    </button>

  </form>

  <div id="message"></div>

  <div class="login">
    Already have an account?
    <a href="login.html">Log in</a>
  </div>

</div>

<script>

const SUPABASE_URL = https://weovrftlcdcgpolmwlgl.supabase.co/rest/v1/

const SUPABASE_PUBLISHABLE_KEY =
  sb_publishable_Z7VJQvGcckiFNuWB1662qQ_CYiGJkwG

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const form = document.getElementById("signupForm");
const button = document.getElementById("signupButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  message.textContent = "Creating your account...";

  button.disabled = true;

  try {

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (error) {
      throw error;
    }

    if (data.session) {

      message.textContent =
        "Account created successfully!";

      setTimeout(function() {
        window.location.href = "dashboard.html";
      }, 1500);

    } else {

      message.textContent =
        "Account created. Please check your email to confirm your account.";

    }

  } catch (error) {

    message.textContent =
      "Signup error: " + error.message;

  } finally {

    button.disabled = false;

  }

});

</script>

</body>
</html>
