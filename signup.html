<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bit-Wealth Signup Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 30px;
    }

    .box {
      max-width: 450px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      box-sizing: border-box;
    }

    button {
      background: #123c72;
      color: white;
      border: 0;
      border-radius: 6px;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #eef3f8;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Bit-Wealth</h1>

  <p>Create a test account.</p>

  <form id="form">

    <input
      id="email"
      type="email"
      placeholder="Email address"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      minlength="8"
      required
    >

    <button id="button" type="submit">
      Test Signup
    </button>

  </form>

  <div id="result">Checking Supabase...</div>

</div>

<script>

const result = document.getElementById("result");

https://weovrftlcdcgpolmwlgl.supabase.co/rest/v1/

sb_publishable_Z7VJQvGcckiFNuWB1662qQ_CYiGJkwG


if (typeof window.supabase === "undefined") {

  result.textContent =
    "ERROR: Supabase library did not load.";

} else {

  result.textContent =
    "SUCCESS: Supabase library loaded.";
  
alert("Supabase JavaScript is loaded!");
  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  document.getElementById("form").addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      result.textContent =
        "Testing connection to Supabase...";

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      try {

        const response =
          await client.auth.signUp({
            email: email,
            password: password
          });

        if (response.error) {

          result.textContent =
            "SUPABASE ERROR:\n\n" +
            response.error.message;

          return;
        }

        result.textContent =
          "SUCCESS!\n\n" +
          "Supabase accepted the signup request.";

      } catch (error) {

        result.textContent =
          "CONNECTION ERROR:\n\n" +
          error.message;

      }

    }
  );

}

</script>

</body>
</html>
