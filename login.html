<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Bit-Wealth</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #071f43, #1769aa);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      color: #123c72;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      color: #172033;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #68778b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dce5;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #123c72;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      color: #123c72;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      line-height: 2;
    }

    .links a {
      color: #1769aa;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="logo">Bit-Wealth</div>

  <h1>Welcome Back</h1>

  <p class="subtitle">
    Sign in to your Bit-Wealth account.
  </p>

  <form id="loginForm">

    <label for="email">Email Address</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit" id="loginButton">
      Log In
    </button>

  </form>

  <div id="message"></div>

  <div class="links">
    <div>
      <a href="forgot-password.html">Forgot Password?</a>
    </div>

    <div>
      Don't have an account?
      <a href="signup.html">Create Account</a>
    </div>
  </div>

</div>


<script>

const SUPABASE_URL = https://weovrftlcdcgpolmwlgl.supabase.co/rest/v1/

const SUPABASE_PUBLISHABLE_KEY =
  sb_publishable_Z7VJQvGcckiFNuWB1662qQ_CYiGJkwG

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  message.textContent = "Signing in...";
  button.disabled = true;

  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      throw error;
    }

    if (!data.session) {
      throw new Error("No active login session was created.");
    }

    message.textContent = "Login successful. Opening dashboard...";

    setTimeout(function() {
      window.location.href = "dashboard.html";
    }, 700);

  } catch (error) {

    message.textContent =
      "Login error: " + error.message;

  } finally {

    button.disabled = false;

  }

});

</script>

</body>
</html>
