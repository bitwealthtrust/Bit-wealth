<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Bit-Wealth</title>

  <meta name="description" content="Log in to your Bit-Wealth account.">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #071f43, #1769aa);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 450px;
    }

    .logo {
      text-align: center;
      color: white;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    h1 {
      color: #123c72;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #657386;
      margin-bottom: 28px;
      font-size: 14px;
    }

    label {
      display: block;
      color: #26364d;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d7dee8;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #1769aa;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #123c72;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1769aa;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #657386;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
    }

    .links a {
      color: #1769aa;
      text-decoration: none;
      font-weight: bold;
    }

    .back {
      text-align: center;
      margin-top: 20px;
    }

    .back a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">Bit-Wealth</div>

    <div class="card">

      <h1>Welcome Back</h1>

      <p class="subtitle">
        Log in to your Bit-Wealth account.
      </p>

      <form id="loginForm">

        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <button type="submit" id="loginButton">
          Log In
        </button>

      </form>

      <div id="message"></div>

      <div class="links">
        Don't have an account?
        <a href="signup.html">Create an account</a>
      </div>

      <div class="links">
        <a href="forgot-password.html">Forgot your password?</a>
      </div>

    </div>

    <div class="back">
      <a href="index.html">← Back to Bit-Wealth</a>
    </div>

  </div>

  <script>

    // ==========================================
    // BIT-WEALTH SUPABASE CONFIGURATION
    // ==========================================

    https://weovrftlcdcgpolmwlgl.supabase.co/rest/v1/

    sb_publishable_Z7VJQvGcckiFNuWB1662qQ_CYiGJkwG

    const { createClient } = supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    // ==========================================
    // LOGIN
    // ==========================================

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      message.textContent = "";

      button.disabled = true;
      button.textContent = "Logging in...";

      try {

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          throw error;
        }

        message.textContent =
          "Login successful. Opening your dashboard...";

        window.location.href = "dashboard.html";

      } catch (error) {

        message.textContent =
          error.message || "Unable to log in.";

      } finally {

        button.disabled = false;
        button.textContent = "Log In";

      }

    });

  </script>

</body>
  </html>
